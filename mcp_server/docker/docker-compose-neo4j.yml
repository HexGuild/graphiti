name: graphiti

services:
  neo4j:
    image: neo4j:5.26.0
    ports:
      - "127.0.0.1:7474:7474" # HTTP
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-hexguild}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - graphiti

  graphiti-mcp:
    # To use the latest graphiti-core, build locally with:
    #   docker compose -f docker-compose-neo4j.yml build --build-arg GRAPHITI_CORE_VERSION=0.31.2
    # The Docker Hub image may lag behind the latest release.
    image: zepai/knowledge-graph-mcp:standalone
    build:
      context: ..
      dockerfile: docker/Dockerfile.standalone
    env_file:
      - path: ../.env
        required: false
    depends_on:
      neo4j:
        condition: service_healthy
        restart: true
    environment:
      # Database configuration
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-hexguild}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      # Application configuration
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-hexi}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=/app/mcp/config/config.yaml
      # Bind to 0.0.0.0 inside the container so HEXi can reach the MCP server
      # over the shared `hexguild` Docker network. The host port binding below
      # is still restricted to 127.0.0.1.
      - SERVER__HOST=0.0.0.0
    volumes:
      - ../config/config-docker-neo4j.yaml:/app/mcp/config/config.yaml:ro
      # Override with patched MCP server that adds source_node_labels/target_node_labels to add_triplet.
      # The FastMCP DNS rebinding patches are no longer needed: MCP SDK 2.x exposes
      # the host as a first-class config field (SERVER__HOST above).
      - ../src/graphiti_mcp_server.py:/app/mcp/src/graphiti_mcp_server.py:ro
    ports:
      - "127.0.0.1:8000:8000" # Expose MCP server to localhost only; HEXi reaches it via the hexguild network.
    command: ["uv", "run", "--no-sync", "main.py"]
    healthcheck:
      # CMD-SHELL variant tolerates "connection refused" during the startup
      # window instead of failing the probe immediately.
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8000/health 2>&1 | grep -qv 'refused' && exit 0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - graphiti
      - hexguild  # shared with HEXi stack so hexi container resolves graphiti-mcp hostname

networks:
  graphiti:
    driver: bridge
  hexguild:
    name: hexguild   # fixed name so HEXi compose can reference it as external
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
